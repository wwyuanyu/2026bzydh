<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坂中运动会</title>
<link rel="icon" href="https://img.remit.ee/i/XYOAesvk3v0C" type="image/jpeg">
<link rel="shortcut icon" href="https://img.remit.ee/i/XYOAesvk3v0C" type="image/jpeg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#f5f5f5;color:#333}

/* 首屏 */
.hero{position:relative;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;overflow:hidden}

/* 封面图 - 底部再裁掉一截 */
.hero::before{
  content:'';position:absolute;inset:0;
  background:url('https://a.imgckr.com/2026/11/20/n3jUm.jpg') center 25%/cover no-repeat;
  z-index:0;
  clip-path:inset(0 0 12% 0); /* 底部裁掉12% */
}

/* 底部黑纱遮罩 - 加厚 */
.hero::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.5) 22%, rgba(220,38,38,.55) 55%, rgba(0,0,0,.45) 100%);
  z-index:1;
}

.hero>*{position:relative;z-index:2}

/* 圆形logo */
.hero-logo-img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 32px rgba(0,0,0,.3);margin-bottom:24px;animation:fadeIn .8s ease}

/* 标题 */
.hero h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:900;letter-spacing:4px;text-shadow:0 4px 20px rgba(0,0,0,.4)}
.hero p{font-size:1.1rem;margin-top:12px;opacity:.9}

/* 图集 */
.gallery{padding:60px 20px;max-width:1200px;margin:0 auto}
.gallery h2{text-align:center;font-size:2rem;margin-bottom:8px;color:#dc2626}
.gallery-sub{text-align:center;color:#666;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.grid img{width:100%;height:220px;object-fit:cover;border-radius:12px;cursor:pointer;transition:transform .3s,box-shadow .3s}
.grid img:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.2)}

/* 灯箱 */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:9999;flex-direction:column}
.lightbox.active{display:flex}
.lightbox img{max-width:90%;max-height:80vh;border-radius:8px}
.lightbox-close,.lightbox-prev,.lightbox-next{position:absolute;color:#fff;font-size:2rem;cursor:pointer;user-select:none;padding:16px}
.lightbox-close{top:20px;right:30px}
.lightbox-prev{left:20px;top:50%}
.lightbox-next{right:20px;top:50%}

/* 页脚 */
footer{background:#1a1a1a;color:#999;padding:32px 20px;text-align:center;font-size:.9rem;line-height:1.8}
footer a{color:#ffb457;text-decoration:none}
footer a:hover{text-decoration:underline;color:#ffd166}

@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- 首屏 -->
<section class="hero">
  <img class="hero-logo-img" src="https://img.remit.ee/i/XYOAesvk3v0C" alt="坂中运动会">
  <h1>坂中运动会</h1>
  <p>11月19日 — 11月20日 · 两天热血，一份永存的青春记忆</p>
</section>

<!-- 个人实拍 -->
<section class="gallery">
  <h2>个人实拍</h2>
  <p class="gallery-sub">定格赛场上那些难忘的个人瞬间</p>
  <div class="grid" id="grid">
    <img src="https://a.imgckr.com/2026/11/20/n3ool.jpg" alt="个人实拍">
    <img src="https://a.imgckr.com/2026/11/20/n3Fye.jpg" alt="个人实拍">
    <img src="https://a.imgckr.com/2026/11/20/n3RUS.jpg" alt="个人实拍">
    <img src="https://a.imgckr.com/2026/11/20/n31rE.jpg" alt="个人实拍">
    <img src="https://a.imgckr.com/2026/11/20/n3a0q.jpg" alt="个人实拍">
    <img src="https://a.imgckr.com/2026/11/20/n3Klu.jpg" alt="个人实拍">
    <img src="https://a.imgckr.com/2026/11/20/n3Hgd.jpg" alt="个人实拍">
    <img src="https://a.imgckr.com/2026/11/20/n3Emv.jpg" alt="个人实拍">
    <img src="https://a.imgckr.com/2026/11/20/n343K.jpg" alt="个人实拍">
    <img src="https://a.imgckr.com/2026/11/20/n3bqC.jpg" alt="个人实拍">
  </div>
</section>

<!-- 页脚 -->
<footer>
  <p>© 2026 <a href="https://wwyuanyu.github.io/yuan/" target="_blank" rel="noopener noreferrer">云家·制作</a> · 图片供应 <a href="https://v.kuaishou.com/J1SFd1It" target="_blank" rel="noopener noreferrer">叶*宣</a>（快手原片）</p>
  <p><a href="https://wwyuanyu.github.io/yuan/" target="_blank" rel="noopener noreferrer">站长主页：渊的主页🐾</a> · <a href="https://v.kuaishou.com/J1SFd1It" target="_blank" rel="noopener noreferrer">图片供应者快手</a></p>
</footer>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="closeBox()">×</span>
  <span class="lightbox-prev" onclick="prevImg()">‹</span>
  <img id="lightbox-img" src="" alt="">
  <span class="lightbox-next" onclick="nextImg()">›</span>
</div>

<script>
const imgs = document.querySelectorAll('.grid img');
const box = document.getElementById('lightbox');
const boxImg = document.getElementById('lightbox-img');
let current = 0;

imgs.forEach((img, i) => {
  img.addEventListener('click', () => {
    current = i;
    boxImg.src = img.src;
    box.classList.add('active');
  });
});

function closeBox(){ box.classList.remove('active') }
function prevImg(){ current = (current - 1 + imgs.length) % imgs.length; boxImg.src = imgs[current].src }
function nextImg(){ current = (current + 1) % imgs.length; boxImg.src = imgs[current].src }
document.addEventListener('keydown', e => {
  if(e.key==='Escape') closeBox();
  if(e.key==='ArrowLeft') prevImg();
  if(e.key==='ArrowRight') nextImg();
});
</script>
</body>
</html>
